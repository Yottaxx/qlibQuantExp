version: 1

# This file is the single source of truth for KDD sweep bookkeeping:
# - what to run (universe × setting × seed)
# - where to find the MLflow run (experiment_name + run_id)
# - which config overrides define the setting
#
# Fill `run_ids` after runs complete. The aggregator script uses this file.

mlruns_dir: mlruns

# KDD target: 5 seeds
seeds: [42, 43, 44, 45, 46]

task:
  horizon: t+5
  label_expr: "Ref($close, -5) / Ref($close, -1) - 1"

universes:
  csi300:
    instruments: csi300
    market_state_path: artifacts/market_state/daily_market_field_csi300.pkl
    # Current workflows build dynamic experiment names from resolved configs.
    # Leave this null unless you intentionally pin a static MLflow experiment name.
    experiment_name: null
  csi800:
    instruments: csi800
    market_state_path: artifacts/market_state/daily_market_field_csi800.pkl
    experiment_name: null

# Default knobs for bookkeeping / experiment notes.
# The current aggregation script does not consume these fields as launch config.
# Keep them in sync with the actual runner you used for the sweep.
defaults:
  trainer_config:
    lr: 5.0e-4
    n_epochs: 40
    early_stop: 5
    batch_size: 128
    grad_accum_steps: 5
    num_workers: 4
    seed: null  # filled per seed
    use_warmup: true
    warmup_ratio: 0.05
    warmup_steps: 0
    market_state_shift: 0
    market_state_strict: true
    market_day_summary_path: null
    market_day_summary_shift: 0
    market_day_summary_strict: true
  model_config:
    d_model: 128
    n_layers: 4
    n_heads: 4
    d_ff: 256
    dropout: 0.1
    use_alibi: false
    # Router (MoE)
    router_use_layer_summary: false
    router_summary_source: day_asset
    router_noise: 0.1
    router_temperature: 0.8
    router_z_loss_coef: 0.01
    # Ranking objective
    main_loss: mse
    listmle_tau: 0.8
    pooling_alpha: 0.7
    pooling_summary_source: day_asset
    # Regime-adaptive embedding defaults (t+5)
    use_regime_time_embedding: true
    time_tau_init: 5.0
    use_regime_factor_gate: true
    factor_gate_scale: 0.5
    # Macro encoder regularization
    regime_macro_dropout: 0.1
    # Keep STG off by default; enable only for dedicated ablation
    use_feature_selection: false
    selection_reg_lambda: 1.0e-5
    selection_temperature: 0.1
    selection_noise_std: 0.5

# Macro precompute defaults (for consistency across sweep runs)
macro_precompute:
  profile: kaiming
  scale: robust
  no_norm: true
  pca_dim: 16
  pca_fit_on: train
  state_delta_lags: []
  add_market_ts: true
  market_ts_windows: [5, 20, 60]
  zscore_windows: []
  roll_mean: 0

# Settings = minimal ablations that isolate contributions.
# NOTE: “Structural routing controls” (time-only/factor-only/fixed-gate/no-regime-router) are NOT listed here
# because they require explicit code support (e.g., a router_mode flag). Add them after implementing.
run_groups:
  # -------------------------
  # Conditioning ablations
  # -------------------------
  - setting: base
    description: "No regime-adaptive embeddings/gates (router still learns)."
    overrides:
      model_config:
        use_regime_time_embedding: false
        use_regime_factor_gate: false
        use_feature_selection: false
    runs:
      - universe: csi300
        run_ids: {42: null, 43: null, 44: null, 45: null, 46: null}
      - universe: csi800
        run_ids: {42: null, 43: null, 44: null, 45: null, 46: null}

  - setting: time_emb_only
    description: "Regime-adaptive time embedding only."
    overrides:
      model_config:
        use_regime_time_embedding: true
        use_regime_factor_gate: false
        use_feature_selection: false
    runs:
      - universe: csi300
        run_ids: {42: null, 43: null, 44: null, 45: null, 46: null}
      - universe: csi800
        run_ids: {42: null, 43: null, 44: null, 45: null, 46: null}

  - setting: film_only
    description: "Regime-adaptive factor FiLM only."
    overrides:
      model_config:
        use_regime_time_embedding: false
        use_regime_factor_gate: true
        use_feature_selection: false
    runs:
      - universe: csi300
        run_ids: {42: null, 43: null, 44: null, 45: null, 46: null}
      - universe: csi800
        run_ids: {42: null, 43: null, 44: null, 45: null, 46: null}

  - setting: full
    description: "Default RST-MoE conditioning: time embedding + factor FiLM (STG off)."
    overrides:
      model_config:
        use_regime_time_embedding: true
        use_regime_factor_gate: true
        use_feature_selection: false
    runs:
      - universe: csi300
        run_ids: {42: null, 43: null, 44: null, 45: null, 46: null}
      - universe: csi800
        run_ids: {42: null, 43: null, 44: null, 45: null, 46: null}

  - setting: full_plus_stg
    description: "Full + STG feature selection (expect higher tuning sensitivity)."
    overrides:
      model_config:
        use_regime_time_embedding: true
        use_regime_factor_gate: true
        use_feature_selection: true
        selection_reg_lambda: 1.0e-5
    runs:
      - universe: csi300
        run_ids: {42: null, 43: null, 44: null, 45: null, 46: null}
      - universe: csi800
        run_ids: {42: null, 43: null, 44: null, 45: null, 46: null}
